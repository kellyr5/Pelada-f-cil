<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset - Pelada Fácil</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(26, 31, 58, 0.95);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.125rem;
            color: #c4c4c4;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #00c853 0%, #00a843 100%);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin: 0.5rem;
        }
        .btn:hover {
            transform: translateY(-3px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .success {
            color: #00c853;
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .info-box {
            background: rgba(0, 102, 255, 0.1);
            border: 1px solid rgba(0, 102, 255, 0.3);
            padding: 1rem;
            border-radius: 12px;
            margin-top: 2rem;
            font-size: 0.875rem;
            color: #c4c4c4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success">🔄</div>
        <h1>Reset de Sessão</h1>
        <p id="message">Clique no botão abaixo para limpar sua sessão e resolver problemas de login.</p>

        <div id="buttons">
            <button class="btn" onclick="resetSession()">
                🧹 Limpar Sessão
            </button>
            <br>
            <button class="btn btn-secondary" onclick="goToLogin()">
                🔐 Ir para Login
            </button>
        </div>

        <div class="info-box">
            <strong>ℹ️ O que isso faz?</strong><br>
            Remove todos os dados salvos no navegador e permite fazer login novamente sem erros.
        </div>
    </div>

    <script>
        function resetSession() {
            // Clear localStorage
            localStorage.clear();

            // Clear sessionStorage
            sessionStorage.clear();

            // Update UI
            document.getElementById('message').innerHTML =
                '<strong style="color: #00c853;">✅ Sessão limpa com sucesso!</strong><br><br>' +
                'Agora você pode fazer login normalmente.';

            document.getElementById('buttons').innerHTML = `
                <button class="btn" onclick="goToLogin()">
                    🚀 Ir para Login
                </button>
            `;

            // Show success message
            console.log('✅ Sessão resetada com sucesso!');
            console.log('Você pode fazer login novamente.');
        }

        function goToLogin() {
            window.location.href = 'login.html';
        }

        // Auto-check
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn) {
                console.log('⚠️ Sessão ativa detectada. Use o botão para limpar.');
            } else {
                console.log('✅ Nenhuma sessão ativa encontrada.');
            }
        });
    </script>
</body>
</html>
